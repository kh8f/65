name: WIPE REPOSITORY

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete everything
        shell: bash
        run: |
          set -eux

          # احذف كل الملفات والمجلدات الموجودة في نسخة العمل
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +

          # تأكد أن Git يرى الحذف
          git status --short

      - name: Force commit and push
        shell: bash
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "WIPE ALL FILES" || true

          git push origin HEAD:${GITHUB_REF_NAME} --force
