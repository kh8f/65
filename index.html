<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسليم الحساب | MASOUB STORE</title>

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #09090a;
            --surface: rgba(255, 255, 255, 0.045);
            --border: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(255, 255, 255, 0.18);
            --red: #ff0f2b;
            --red-soft: #ff4d5e;
            --gold: #f2c14e;
            --text: #f6f6f8;
            --text-dim: #93949c;
            --text-dimmer: #5f6067;
            --elevated: #17181a;
            --input-bg: rgba(255, 255, 255, 0.035);
            --radius-lg: 20px;
            --radius-sm: 12px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255, 15, 43, 0.16), transparent 60%),
                radial-gradient(ellipse 600px 400px at 100% 20%, rgba(242, 193, 78, 0.05), transparent 60%);
            background-repeat: no-repeat;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            flex-shrink: 0;
        }

        /* الحاوية الكبرى - تفصل لوحة التحكم عن بطاقة التصدير */
        .page-shell {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
        }

        /* لوحة التحكم - عريضة على الكمبيوتر، طولية بالجوال، ولا تدخل أي تصدير */
        .dashboard-controls {
            width: 100%;
            max-width: 480px;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 20px;
            text-align: right;
        }

        .dash-title {
            display: block;
            font-size: 1rem;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 14px;
        }

        @media (min-width: 860px) {
            .page-shell {
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
            }

            .dashboard-controls {
                max-width: 600px;
                flex: 1;
                position: sticky;
                top: 24px;
            }

            .dashboard-controls .actions {
                flex-direction: row;
            }

            .dashboard-controls .actions .btn {
                width: auto;
                flex: 1;
            }
        }

        .card {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            /* backdrop-filter شيل نهائي: كان سبب الطموس/التشويش وقت التصدير كـ PDF
               (المتصفح يرندره كضبابية على كامل الكرت أثناء الطباعة) وأصلاً غير محتاجينه
               لأن خلفية الكرت صلبة مو شفافة */
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--red));
        }

        /* حاوية اللوجو SVG الثابت */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-svg {
            width: 90px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(255, 15, 43, 0.25));
        }

        .title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .title .accent {
            background: linear-gradient(90deg, var(--red-soft), var(--gold));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; }

        .section-label {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 6px;
            font-weight: 600;
            padding-right: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .options-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 18px;
        }

        .opt-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            padding: 8px 4px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s var(--ease);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .opt-btn i { font-size: 1rem; }

        .opt-btn:hover { border-color: var(--border-hover); color: var(--text); }

        .opt-btn.active {
            background: rgba(255, 15, 43, 0.12);
            border-color: var(--red);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 15, 43, 0.2);
        }

        .input-group { margin-bottom: 14px; text-align: right; }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .input-field {
            width: 100%;
            padding: 11px 38px 11px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.92rem;
            font-family: monospace, 'Tajawal', sans-serif;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        .input-icon {
            position: absolute; right: 12px;
            color: var(--text-dimmer); font-size: 0.9rem; pointer-events: none;
        }

        .copy-btn {
            position: absolute; left: 6px;
            background: transparent; border: none;
            color: var(--text-dim); cursor: pointer;
            font-size: 0.85rem; padding: 6px; border-radius: 6px;
        }

        .copy-btn:hover { color: var(--gold); }

        /* شعار الاشتراك المختار - بنفس تدرج لوقو المتجر */
        .sub-logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 4px 0 18px;
        }

        .sub-logo-badge {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gold), var(--red));
            box-shadow: 0 6px 18px rgba(255, 15, 43, 0.3);
            transition: background .3s var(--ease);
        }

        .sub-logo-badge i {
            font-size: 1.6rem;
            color: #0c0c0d;
        }

        .sub-logo-label {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text);
        }

        .badge-info-wrap {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 12px 0 16px;
        }

        .badge-info {
            background: linear-gradient(135deg, rgba(242, 193, 78, 0.22), rgba(255, 15, 43, 0.22));
            border: 1px solid rgba(242, 193, 78, 0.4);
            padding: 5px 12px;
            border-radius: 50px;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge-info i { color: var(--gold); }

        .note {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            border-top: 1px dashed var(--border-hover);
            padding-top: 14px;
            margin-top: 8px;
        }

        .actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--red-soft), var(--red));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 15, 43, 0.3);
        }

        .btn-primary:disabled {
            opacity: .6;
            cursor: wait;
        }

        .btn-secondary {
            background: var(--input-bg);
            border: 1px solid var(--border-hover);
            color: var(--text);
        }

        .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

        .btn-secondary:disabled {
            opacity: .6;
            cursor: wait;
        }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--elevated); color: var(--text); padding: 10px 20px; border-radius: 50px;
            font-weight: 600; font-size: 0.88rem; border: 1px solid rgba(242, 193, 78, 0.35);
            opacity: 0; transition: all .3s var(--ease); pointer-events: none; z-index: 9999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ختم معصوب الرسمي - يطلع بالصفحة وبالـ PDF */
        .stamp {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 72px;
            height: 72px;
            transform: rotate(-14deg);
            opacity: 0.92;
            pointer-events: none;
            z-index: 5;
        }

        .stamp-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--gold);
            outline: 1px solid var(--red);
            outline-offset: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(9, 9, 10, 0.35);
            color: var(--gold);
        }

        .stamp-ring .brand-top { font-size: 0.55rem; font-weight: 800; letter-spacing: 1px; }
        .stamp-ring .brand-bottom { font-size: 0.5rem; font-weight: 700; color: var(--text); letter-spacing: 1.5px; margin-top: 1px; }
        .stamp-ring i { font-size: 1rem; color: var(--red-soft); margin: 2px 0; }

        /* خط فاصل بشكل تذكرة - حواف مقصوصة على الجانبين */
        .ticket-divider {
            position: relative;
            height: 0;
            margin: 22px -24px 20px;
            border-top: 2px dashed var(--border-hover);
        }

        .ticket-divider::before,
        .ticket-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            background: var(--bg);
            border-radius: 50%;
        }

        .ticket-divider::before { left: -13px; }
        .ticket-divider::after { right: -13px; }

        /* قسم دعم الواتساب بالباركود */
        .support-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 4px;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: right;
        }

        .support-qr {
            background: #ffffff;
            padding: 5px;
            border-radius: 8px;
            line-height: 0;
            flex-shrink: 0;
        }

        .support-text .support-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 3px;
        }

        .support-text .support-sub {
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        /* التوقيع الذهبي */
        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--gold), var(--red-soft));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
        }

        /* =========================================================
           إعدادات الطباعة/PDF — مصلّحة
           - @page بحجم ثابت يطابق الكرت (مو A4 كامل) عشان يطلع
             مستطيل نظيف بدون صفحة ثانية وبدون فراغ زايد.
           - backdrop-filter متشال من فوق أصلاً (سبب الطموس).
           - نضمن أن العناصر ماتتحرك ولا تتحجم وقت الطباعة.
        ========================================================= */
        @page {
            size: 135mm 195mm; /* مستطيل ثابت يطابق حجم الكرت + هامش بسيط */
            margin: 0;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
                animation: none !important;
                transition: none !important;
            }

            html, body {
                background-color: #09090a !important;
                /* نفس تدرجات الموقع (بدون أي blur) عشان تطلع نظيفة بالـ PDF */
                background-image:
                    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255, 15, 43, 0.28), transparent 60%),
                    radial-gradient(ellipse 700px 450px at 20% 15%, rgba(255, 15, 43, 0.2), transparent 60%),
                    radial-gradient(ellipse 600px 450px at 100% 25%, rgba(242, 193, 78, 0.18), transparent 60%),
                    radial-gradient(ellipse 500px 500px at 50% 100%, rgba(255, 77, 94, 0.14), transparent 60%) !important;
                background-repeat: no-repeat !important;
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 0 !important;
            }

            .card-wrapper {
                width: 440px !important;
                max-width: 440px !important;
                margin: 0 auto !important;
            }

            .card {
                background-color: rgba(23, 24, 26, 0.92) !important;
                border: 1px solid rgba(255, 255, 255, 0.15) !important;
                box-shadow: none !important;
                padding: 24px 20px !important;
            }

            .badge-info {
                background: linear-gradient(135deg, rgba(242, 193, 78, 0.3), rgba(255, 15, 43, 0.3)) !important;
                border: 1px solid rgba(242, 193, 78, 0.5) !important;
                color: #ffffff !important;
            }

            .no-print, .copy-btn {
                display: none !important;
            }

            .input-field {
                background-color: rgba(255, 255, 255, 0.05) !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
                color: #ffffff !important;
                padding-left: 14px !important;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> تم النسخ بنجاح</div>

    <div class="page-shell">

        <!-- لوحة التحكم - خارج بطاقة التصدير تماماً -->
        <div class="dashboard-controls no-print">
            <span class="dash-title"><i class="fa-solid fa-sliders"></i> لوحة التحكم</span>

            <span class="section-label"><i class="fa-solid fa-list-check"></i> اختر نوع الاشتراك</span>
            <div class="options-grid-4 service-grid">
                <button class="opt-btn active" onclick="selectService('يوتيوب فردي', 'fa-brands fa-youtube', this)">
                    <i class="fa-brands fa-youtube"></i> فردي
                </button>
                <button class="opt-btn" onclick="selectService('يوتيوب عائلي', 'fa-solid fa-users', this)">
                    <i class="fa-solid fa-users"></i> عائلي
                </button>
                <button class="opt-btn" onclick="selectService('شاهد VIP', 'fa-solid fa-clapperboard', this)">
                    <i class="fa-solid fa-clapperboard"></i> شاهد
                </button>
                <button class="opt-btn" onclick="selectService('MASOUB TV', 'fa-solid fa-tv', this)">
                    <i class="fa-solid fa-tv"></i> Masoub TV
                </button>
            </div>

            <span class="section-label"><i class="fa-regular fa-clock"></i> اختر مدة الاشتراك</span>
            <div class="options-grid-4 duration-grid">
                <button class="opt-btn active" onclick="selectDuration('شهر واحد', this)">شهر</button>
                <button class="opt-btn" onclick="selectDuration('3 أشهر', this)">3 أشهر</button>
                <button class="opt-btn" onclick="selectDuration('6 أشهر', this)">6 أشهر</button>
                <button class="opt-btn" onclick="selectDuration('سنة واحدة', this)">سنة</button>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="printBtn" onclick="printSafely()">
                    <i class="fa-solid fa-print"></i> طباعة / تصدير كـ PDF
                </button>
                <button class="btn btn-secondary" id="downloadBtn" onclick="downloadAsImage()">
                    <i class="fa-solid fa-download"></i> تحميل كصورة
                </button>
            </div>
        </div>

        <!-- بطاقة التصدير - ثابتة الشكل، ما تتأثر بلوحة التحكم إطلاقاً -->
        <div class="card-wrapper">
        <div class="card">
            
            <!-- اللوجو SVG الخاص بـ MASOUB STORE -->
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bagGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#f2c14e" />
                            <stop offset="50%" stop-color="#ff0f2b" />
                            <stop offset="100%" stop-color="#ff4d5e" />
                        </linearGradient>
                        <linearGradient id="playGrad" x1="70" y1="70" x2="130" y2="130" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ff4d5e" />
                            <stop offset="100%" stop-color="#f2c14e" />
                        </linearGradient>
                    </defs>
                    <!-- يد الحقيبة -->
                    <path d="M75 65 C75 38, 125 38, 125 65" stroke="url(#bagGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
                    <!-- جسم الحقيبة -->
                    <path d="M45 70 L155 70 C162 70, 167 76, 165 83 L150 162 C148 170, 142 175, 134 175 L66 175 C58 175, 52 170, 50 162 L35 83 C33 76, 38 70, 45 70 Z" 
                          stroke="url(#bagGrad)" stroke-width="11" stroke-linejoin="round" fill="none"/>
                    <!-- أزرار أو ثقوب اليد -->
                    <circle cx="75" cy="70" r="4" fill="url(#bagGrad)"/>
                    <circle cx="125" cy="70" r="4" fill="url(#bagGrad)"/>
                    <!-- أيقونة التشغيل داخل الحقيبة -->
                    <path d="M88 95 L124 116 C127 118, 127 122, 124 124 L88 145 C84 147, 80 144, 80 140 L80 100 C80 96, 84 93, 88 95 Z" 
                          fill="url(#playGrad)"/>
                </svg>
            </div>

            <h1 class="title">شكراً <span class="accent">لشرائكم منا</span></h1>
            <p class="subtitle">تفضل معلومات حسابك الخاص بالاشتراك</p>

            <!-- شعار الاشتراك المختار - بتصميم المتجر -->
            <div class="sub-logo-wrap">
                <div class="sub-logo-badge" id="subLogoBadge">
                    <i class="fa-brands fa-youtube" id="subLogoIcon"></i>
                </div>
                <span class="sub-logo-label" id="subLogoLabel">يوتيوب فردي</span>
            </div>

            <!-- الشارات المعروضة -->
            <div class="badge-info-wrap">
                <span class="badge-info" id="displayService"><i class="fa-brands fa-youtube"></i> يوتيوب فردي</span>
                <span class="badge-info" id="displayDuration"><i class="fa-regular fa-calendar-check"></i> شهر واحد</span>
            </div>

            <!-- خط فاصل بشكل تذكرة -->
            <div class="ticket-divider"></div>

            <!-- 3. البيانات -->
            <div class="input-group">
                <span class="section-label"><i class="fa-regular fa-envelope"></i> البريد الإلكتروني</span>
                <div class="input-wrapper">
                    <i class="fa-solid fa-at input-icon"></i>
                    <input type="text" id="emailInput" class="input-field" placeholder="أدخل البريد الإلكتروني...">
                    <button class="copy-btn no-print" onclick="copyToClipboard('emailInput')" title="نسخ">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <span class="section-label"><i class="fa-solid fa-lock"></i> كلمة المرور</span>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="text" id="passInput" class="input-field" placeholder="أدخل كلمة المرور...">
                    <button class="copy-btn no-print" onclick="copyToClipboard('passInput')" title="نسخ">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- ختم معصوب الرسمي -->
            <div class="stamp">
                <div class="stamp-ring">
                    <span class="brand-top">MASOUB</span>
                    <i class="fa-solid fa-certificate"></i>
                    <span class="brand-bottom">STORE</span>
                </div>
            </div>

            <div class="note">استمتع باشتراكك! ❤️</div>

            <!-- دعم واتساب بالباركود -->
            <div class="support-wrap">
                <div class="support-qr" id="qrcode"></div>
                <div class="support-text">
                    <div class="support-title">تواجه مشكلة؟</div>
                    <div class="support-sub">امسح الكود للتواصل معنا واتساب</div>
                </div>
            </div>

            <div class="signature">Masoub Store</div>

        </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // باركود يفتح محادثة واتساب الدعم مباشرة عند مسحه
        new QRCode(document.getElementById("qrcode"), {
            text: "https://wa.me/966578166461",
            width: 64,
            height: 64,
            colorDark: "#09090a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        function selectService(serviceName, iconClass, btn) {
            document.querySelectorAll('.service-grid .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('displayService').innerHTML = `<i class="${iconClass}"></i> ${serviceName}`;
            document.getElementById('subLogoIcon').className = iconClass;
            document.getElementById('subLogoLabel').textContent = serviceName;
        }

        function selectDuration(durationText, btn) {
            document.querySelectorAll('.duration-grid .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('displayDuration').innerHTML = `<i class="fa-regular fa-calendar-check"></i> ${durationText}`;
        }

        function copyToClipboard(elementId) {
            const input = document.getElementById(elementId);
            if (!input.value) { showToast("يرجى كتابة نص للنسخ"); return; }
            navigator.clipboard.writeText(input.value).then(() => showToast("تم النسخ بنجاح"));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${message}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // نضمن ان خطوط Google Fonts وأيقونات Font Awesome خلصت تحميل
        // قبل ما نفتح نافذة الطباعة، عشان ما تطلع الأيقونات مربعات فاضية
        // أو النص يطلع بخط بديل (وهذا كان أحد أسباب "الشكل المعطوب" بالـ PDF).
        function printSafely() {
            const btn = document.getElementById('printBtn');
            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التجهيز...';

            const ready = (document.fonts && document.fonts.ready)
                ? document.fonts.ready
                : Promise.resolve();

            ready.then(() => {
                // فريم إضافي عشان يضمن أن كل شي اترسم فعليًا قبل فتح حوار الطباعة
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        window.print();
                        btn.disabled = false;
                        btn.innerHTML = originalHTML;
                    });
                });
            });
        }
        // تحميل البطاقة كصورة PNG مباشرة على الجهاز
        // نخفي مؤقتاً كل عناصر التحكم (no-print) عشان الصورة تطلع نظيفة
        // بنفس شكل الطباعة بالضبط، ثم نرجعها بعد التصوير
        function downloadAsImage() {
            const btn = document.getElementById('downloadBtn');
            const card = document.querySelector('.card-wrapper');
            const hiddenEls = document.querySelectorAll('.card-wrapper .no-print');

            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التجهيز...';

            hiddenEls.forEach(el => el.style.visibility = 'hidden');

            const ready = (document.fonts && document.fonts.ready)
                ? document.fonts.ready
                : Promise.resolve();

            ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => {
                html2canvas(card, {
                    backgroundColor: '#09090a',
                    scale: 3,
                    useCORS: true
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'تسليم-الاشتراك.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    hiddenEls.forEach(el => el.style.visibility = '');
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }).catch(() => {
                    hiddenEls.forEach(el => el.style.visibility = '');
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                    showToast("تعذّر إنشاء الصورة، حاول مرة ثانية");
                });
            })));
        }
    </script>
</body>
</html>
